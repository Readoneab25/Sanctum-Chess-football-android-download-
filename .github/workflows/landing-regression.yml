name: Landing 3D regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate site
        run: npm run check
      - name: Verify deterministic portrait camera and scroll animation
        run: node tests/camera-check.mjs
      - name: Build production assets
        run: npm run build
      - name: Verify social image output
        run: |
          node --input-type=module -e "import fs from 'node:fs';import assert from 'node:assert/strict';const b=fs.readFileSync('dist/assets/share-card.png');assert.equal(b.toString('hex',0,8),'89504e470d0a1a0a');assert.equal(b.readUInt32BE(16),1200);assert.equal(b.readUInt32BE(20),630);console.log('PASS PNG 1200x630')"
      - name: Install browser runner
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser tests (desktop, phone, reverse scroll, APK)
        run: node tests/browser-check.mjs
